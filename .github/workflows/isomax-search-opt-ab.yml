name: IsoMax Search Optimization A-B

on:
  push:
    branches:
      - experiment/connect4-managed-runtime-v1
    paths:
      - '.github/workflows/isomax-search-opt-ab.yml'
      - 'addons/rba-connect4-alphabeta.mjs'
      - 'addons/connect4-live-line-evaluator.mjs'
      - 'addons/cpc-connect4.mjs'
      - 'addons/rba-connect4-coordinate.mjs'
      - 'addons/rba-connect4-profile.mjs'
      - 'tools/bench-rba-cpc-ab.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Same-runner CPC search baseline-candidate-candidate-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=b84a5a6e50ce8b18fd8dc4586c0890b690288bf1
          candidate="$GITHUB_SHA"
          run_phase() {
            local label="$1"
            local sha="$2"
            echo "AB_PHASE $label $sha"
            git checkout --detach "$sha"
            echo "JSMS_HEAD $(git rev-parse HEAD)"
            node tools/bench-rba-cpc-ab.mjs
          }
          run_phase baseline-1 "$baseline"
          run_phase candidate-1 "$candidate"
          run_phase candidate-2 "$candidate"
          run_phase baseline-2 "$baseline"
