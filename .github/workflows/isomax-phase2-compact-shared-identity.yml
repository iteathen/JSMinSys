name: IsoMax Phase2 compact shared identity

on:
  pull_request:
    branches: [experiment/isomax-phase2-shared-hash-coalesced-20260927]
    paths:
      - ".github/workflows/isomax-phase2-compact-shared-identity.yml"
      - "experiments/isomax-phase2/compact-shared-identity-check.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Verify lossless compact identity
        run: node experiments/isomax-phase2/compact-shared-identity-check.mjs
