name: IsoMax Phase2 coalesced-bound census

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-phase2-coalesced-bound-census.yml"
      - "experiments/isomax-phase2/coalesced-bound-census-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize retained winner
        shell: pwsh
        run: git worktree add "$env:RUNNER_TEMP/winner" e449df20dc59cc6c1e5b2da78134751a2376f355
      - name: Exact derived-long census
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/isomax-phase2-coalesced-bound-census" | Out-Null
          node --import ./experiments/isomax-phase2/coalesced-bound-census-hook.mjs ./experiments/isomax-phase2/coalesced-bound-census-run.mjs "$env:RUNNER_TEMP/winner" 353335714 90000 | Out-File -Encoding utf8 "$env:RUNNER_TEMP/isomax-phase2-coalesced-bound-census/derived-long.json"
      - name: Hard fixed-window census
        shell: pwsh
        run: node --import ./experiments/isomax-phase2/coalesced-bound-census-hook.mjs ./experiments/isomax-phase2/coalesced-bound-census-run.mjs "$env:RUNNER_TEMP/winner" 35333571 60000 | Out-File -Encoding utf8 "$env:RUNNER_TEMP/isomax-phase2-coalesced-bound-census/hard-60s.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-coalesced-bound-census
          path: ${{ runner.temp }}/isomax-phase2-coalesced-bound-census
          if-no-files-found: error
          retention-days: 30
