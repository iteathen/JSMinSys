name: IsoMax stage5 scalar profile

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-stage5-scalar-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize harness and control
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/harness" 7e820dac1fd375bbe2ad7a747adbbc233a2769b9
          git worktree add "$env:RUNNER_TEMP/control" bc7380837f6ba65d513f31e5de89ac766f09df9f
      - name: Profile control
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP/isomax-stage5-profile/control"
          New-Item -ItemType Directory -Force $out | Out-Null
          node --experimental-ffi --cpu-prof --cpu-prof-dir=$out "$env:RUNNER_TEMP/harness/experiments/isomax-cofactor-plan/sample.mjs" "$env:RUNNER_TEMP/control" 353335714 | Out-File -Encoding utf8 "$out/sample.json"
      - name: Profile scalar candidate
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP/isomax-stage5-profile/candidate"
          New-Item -ItemType Directory -Force $out | Out-Null
          node --experimental-ffi --cpu-prof --cpu-prof-dir=$out "$env:RUNNER_TEMP/harness/experiments/isomax-cofactor-plan/sample.mjs" . 353335714 | Out-File -Encoding utf8 "$out/sample.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-stage5-scalar-profile
          path: ${{ runner.temp }}/isomax-stage5-profile
          if-no-files-found: error
          retention-days: 30
