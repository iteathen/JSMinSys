name: IsoMax Phase2 census smoke

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-phase2-census-smoke.yml"
      - "experiments/isomax-phase2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize known Phase1 source
        shell: pwsh
        run: git worktree add "$env:RUNNER_TEMP/phase2-smoke-source" 10380f79af68dc1f57455d535814ac0a7eacea33
      - name: Run search census smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/isomax-phase2-census-smoke" | Out-Null
          node --import ./experiments/isomax-phase2/search-census-hook.mjs ./experiments/isomax-phase2/search-census-run.mjs "$env:RUNNER_TEMP/phase2-smoke-source" 45461667 | Out-File -Encoding utf8 "$env:RUNNER_TEMP/isomax-phase2-census-smoke/short.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-census-smoke
          path: ${{ runner.temp }}/isomax-phase2-census-smoke
          if-no-files-found: error
          retention-days: 7
