name: IsoMax Phase2 realized zero-bound TT

on:
  push:
    branches:
      - experiment/isomax-phase2-bound-realized-20260927

permissions:
  contents: read

jobs:
  realized:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize frozen Stage-9 denominator
        shell: pwsh
        run: git worktree add "$env:RUNNER_TEMP/phase2-denominator" 10380f79af68dc1f57455d535814ac0a7eacea33
      - name: Directed narrow-window oracle — search bounds
        shell: pwsh
        env:
          ISOMAX_BOUND_POLICY: search
        run: node experiments/isomax-phase2/bound-window-check.mjs "$env:RUNNER_TEMP/phase2-denominator"
      - name: Directed narrow-window oracle — CPC bounds
        shell: pwsh
        env:
          ISOMAX_BOUND_POLICY: cpc
        run: node experiments/isomax-phase2/bound-window-check.mjs "$env:RUNNER_TEMP/phase2-denominator"
      - name: Directed narrow-window oracle — combined bounds
        shell: pwsh
        env:
          ISOMAX_BOUND_POLICY: both
        run: node experiments/isomax-phase2/bound-window-check.mjs "$env:RUNNER_TEMP/phase2-denominator"
      - name: Long A/B/C/D
        shell: pwsh
        run: node experiments/isomax-phase2/bound-realized-run.mjs "$env:RUNNER_TEMP/isomax-phase2-bound-realized/long" "$env:RUNNER_TEMP/phase2-denominator" 353335714 8
      - name: Short A/B/C/D
        shell: pwsh
        run: node experiments/isomax-phase2/bound-realized-run.mjs "$env:RUNNER_TEMP/isomax-phase2-bound-realized/short" "$env:RUNNER_TEMP/phase2-denominator" 45461667 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-bound-realized
          path: ${{ runner.temp }}/isomax-phase2-bound-realized
          if-no-files-found: error
          retention-days: 30
