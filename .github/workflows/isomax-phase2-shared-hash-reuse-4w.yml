name: IsoMax Phase2 4-worker shared hash reuse

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-phase2-shared-hash-reuse-4w.yml"
      - "experiments/isomax-phase2/scaled4-shared-hash-reuse.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash-reuse:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize fixed verified arms
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/arm-a" e449df20dc59cc6c1e5b2da78134751a2376f355
          git worktree add "$env:RUNNER_TEMP/arm-b" 4161b37e949adf05d3e10978547a40adf15a2743
          git worktree add "$env:RUNNER_TEMP/arm-c" 2cf45625023877072a9a4e6f4e2667a7aee7b4c2
          git worktree add "$env:RUNNER_TEMP/arm-d" 48c514e747cb2656666b951f97e0928dda501cf7
      - name: Derived long exact screen
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-shared-hash-reuse.mjs "$env:RUNNER_TEMP/isomax-phase2-shared-hash-reuse/derived-long" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" "$env:RUNNER_TEMP/arm-c" "$env:RUNNER_TEMP/arm-d" 353335714 4 90000
      - name: Official hard fixed-window screen
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-shared-hash-reuse.mjs "$env:RUNNER_TEMP/isomax-phase2-shared-hash-reuse/official-hard" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" "$env:RUNNER_TEMP/arm-c" "$env:RUNNER_TEMP/arm-d" 35333571 1 120000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-shared-hash-reuse-4w
          path: ${{ runner.temp }}/isomax-phase2-shared-hash-reuse
          if-no-files-found: error
          retention-days: 30
