name: IsoMax cofactor plan census

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-cofactor-plan-census.yml"
      - "experiments/isomax-cofactor-plan-census/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Long support-plan census
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/isomax-cofactor-plan-census" | Out-Null
          node --import ./experiments/isomax-cofactor-plan-census/hook.mjs ./experiments/isomax-cofactor-plan-census/run.mjs 353335714 | Out-File -Encoding utf8 "$env:RUNNER_TEMP/isomax-cofactor-plan-census/long.json"
      - name: Short support-plan census
        shell: pwsh
        run: |
          node --import ./experiments/isomax-cofactor-plan-census/hook.mjs ./experiments/isomax-cofactor-plan-census/run.mjs 45461667 | Out-File -Encoding utf8 "$env:RUNNER_TEMP/isomax-cofactor-plan-census/short.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-cofactor-plan-census
          path: ${{ runner.temp }}/isomax-cofactor-plan-census
          if-no-files-found: error
          retention-days: 30
