name: NEES RBA Guard Proof Memo

on:
  push:
    branches:
      - research/cpc-guard-proof-memo-nees-v1
    paths:
      - .github/workflows/nees-rba-guard-proof-memo.yml
      - addons/rba-connect4-proof-memo.mjs
      - test/rba-connect4-proof-memo.test.mjs
      - catalog/addon-cycle-ledger-v0.json
      - tools/verify-catalog.mjs

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify JSMinSys catalog and NEES cycle ledger
        run: node tools/verify-catalog.mjs
      - name: Run exact proof-memo tests
        run: node --test test/rba-connect4-proof-memo.test.mjs
