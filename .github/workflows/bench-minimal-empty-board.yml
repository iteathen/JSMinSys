name: Minimal Empty Board Development Solve

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bench-minimal-empty-board.yml

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/cpc-rebuild-20261004
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          check-latest: false
      - name: Run complete empty-board minimal solve
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {performance} from 'node:perf_hooks';
          import {prepareConnect4RbaGeometry} from './addons/rba-connect4-geometry.mjs';
          import {
            runLazySmpConnect4Rba32,
            RBA_LAZY_SMP_WORKER_MINIMAL,
          } from './addons/rba-connect4-lazy-smp-host.mjs';

          const geometry=prepareConnect4RbaGeometry({columns:7,rows:6});
          const t0=performance.now();
          const result=await runLazySmpConnect4Rba32([],{
            geometry,
            workers:4,
            workerMode:RBA_LAZY_SMP_WORKER_MINIMAL,
            sharedCacheCapacity:4194304,
            localCacheCapacity:1048576,
            sharedSampleMask:0,
            timeoutMs:600000,
          });
          console.log('EMPTY7X6 '+JSON.stringify({
            wallMs:performance.now()-t0,
            status:result.status,
            rootWdl:result.rootWdl,
            move:result.move,
            winner:result.winner,
            sharedCacheHits:result.sharedCacheHits,
            sharedCacheStores:result.sharedCacheStores,
            sharedCacheStoreContention:result.sharedCacheStoreContention,
            cleanup:result.cleanup,
            workersExited:result.workersExited,
            sharedBytes:result.sharedBytes,
            errorCode:result.errorCode,
          }));
          if(result.status!=='EXACT')process.exitCode=2;
          NODE
