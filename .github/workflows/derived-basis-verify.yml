name: Derived Basis Verify

on:
  push:
    branches:
      - experiment/assertion-derived-basis-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - run: node tools/verify-catalog.mjs
      - run: node tools/audit-runtime-geometry.mjs
      - run: node --test test/*.test.mjs
      - run: node tools/bench-rba-cpc-ab.mjs
      - run: node tools/bench-rba-addons.mjs
