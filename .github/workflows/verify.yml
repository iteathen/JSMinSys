name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - run: node tools/verify-catalog.mjs
      # Historical behavior generator diverged before the minimal campaign.
      # Catalog locks/tests still cover it; verify the promoted generators here.
      - run: node tools/build-rba-minimal-center.mjs --check
      - run: node tools/build-rba-shared-proof-workers.mjs --check
      - run: node tools/build-rba-local-native-workers.mjs --check
      - run: node tools/build-rba-basis-view-kernels.mjs --check
      - run: node tools/build-rba-support-handle-kernels.mjs --check
      - run: node tools/build-rba-basis-view-workers.mjs --check
      - run: node tools/build-rba-prepared-compact-cache.mjs --check
      - run: node tools/build-rba-compiled-transition-kernels.mjs --check
      - run: node tools/build-rba-compiled-transition-workers.mjs --check
      - run: node tools/build-cpc-matching-response.mjs --check
      - run: node tools/build-root-frontier.mjs --check
      - run: node tools/build-rba-coordinate-kernels.mjs --check
      - run: node tools/audit-root-frontier.mjs
      - run: node tools/audit-runtime-geometry.mjs
      - run: node --test test/*.test.mjs
      - run: node isomax/verify.mjs
      - run: node --test isomax/test/*.test.mjs
      - run: node tools/bench-rba-cpc-ab.mjs
      - run: node tools/bench-rba-addons.mjs

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - run: node -e "const fs=require('fs'); for (const f of fs.readdirSync('catalog').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('catalog/'+f,'utf8'));"

  node-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - run: for f in src/*.mjs addons/*.mjs tools/*.mjs test/*.mjs test/fixtures/*.mjs; do node --check "$f"; done
