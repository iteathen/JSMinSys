name: Worker Compare Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bench-worker-compare.yml

jobs:
  bench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: old-main
            ref: main
          - label: new-rebuild
            ref: work/cpc-rebuild-20261004
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          check-latest: false
      - name: Run worker benchmark
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {performance} from 'node:perf_hooks';
          import {prepareConnect4RbaGeometry} from './addons/rba-connect4-geometry.mjs';
          import {runLazySmpConnect4Rba32} from './addons/rba-connect4-lazy-smp-host.mjs';

          const label = process.env.BENCH_LABEL;
          const cases = [
            {name:'4x4-mid', columns:4, rows:4, moves:[0,1,0,1], timeoutMs:30000},
            {name:'7x6-late', columns:7, rows:6, moves:[4,0,0,0,3,3,0,0,6,2,3,0,2,3,6,3,6,3,4,6,2,2,6,1,2,5,6,4], timeoutMs:30000},
          ];
          const repeats = 5;
          for (const c of cases) {
            const geometry=prepareConnect4RbaGeometry({columns:c.columns,rows:c.rows});
            for(let run=0;run<repeats;run++){
              const t0=performance.now();
              const result=await runLazySmpConnect4Rba32(c.moves,{
                geometry,
                workers:4,
                sharedCacheCapacity:65536,
                localCacheCapacity:65536,
                sharedSampleMask:0,
                timeoutMs:c.timeoutMs,
              });
              const wallMs=performance.now()-t0;
              console.log('BENCH '+JSON.stringify({
                label,case:c.name,run,
                wallMs,
                status:result.status,
                rootWdl:result.rootWdl,
                move:result.move,
                winner:result.winner,
                winnerMetrics:result.winnerMetrics,
                sharedCacheHits:result.sharedCacheHits,
                sharedCacheStores:result.sharedCacheStores,
                sharedCacheStoreContention:result.sharedCacheStoreContention,
                workersUsed:result.workersUsed,
              }));
              if(result.status!=='EXACT') process.exitCode=1;
            }
          }
          NODE
        env:
          BENCH_LABEL: ${{ matrix.label }}
