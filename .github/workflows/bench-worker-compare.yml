name: Worker Compare Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bench-worker-compare.yml

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout old main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: old
      - name: Checkout new rebuild
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/cpc-rebuild-20261004
          path: new
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          check-latest: false
      - name: Run same-runner worker benchmark
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {performance} from 'node:perf_hooks';
          import {pathToFileURL} from 'node:url';

          async function load(base){
            const geometry=await import(pathToFileURL(process.cwd()+'/'+base+'/addons/rba-connect4-geometry.mjs'));
            const host=await import(pathToFileURL(process.cwd()+'/'+base+'/addons/rba-connect4-lazy-smp-host.mjs'));
            return {prepareConnect4RbaGeometry:geometry.prepareConnect4RbaGeometry,runLazySmpConnect4Rba32:host.runLazySmpConnect4Rba32};
          }
          const impl={old:await load('old'),new:await load('new')};
          const cases=[
            {name:'4x4-A',columns:4,rows:4,moves:[0,1,0,1]},
            {name:'4x4-B',columns:4,rows:4,moves:[1,2,1,2,0,3]},
            {name:'4x4-C',columns:4,rows:4,moves:[0,1,1,3,2]},
            {name:'4x4-D',columns:4,rows:4,moves:[2,1,2,0,3,1]},
            {name:'4x4-E',columns:4,rows:4,moves:[0,3,1,3,2,0,2]},
            {name:'7x6-A',columns:7,rows:6,moves:[4,0,0,0,3,3,0,0,6,2,3,0,2,3,6,3,6,3,4,6,2,2,6,1,2,5,6,4]},
            {name:'7x6-B',columns:7,rows:6,moves:[2,0,5,3,6,3,5,2,3,3,3,5,0,5,0,0,1,6,1,4,3,4,2,6,6,0,6,4]},
            {name:'7x6-C',columns:7,rows:6,moves:[6,0,2,1,5,2,1,1,1,0,5,2,5,2,4,1,0,1,4,3,2,6,6,6,6,2,4,4,0,6,0,3,4,5,4]},
            {name:'7x6-D',columns:7,rows:6,moves:[1,3,2,0,4,6,1,0,2,4,5,2,2,3,1,1,1,5,1,3,2,4,6,0,4,4,6,2,0,4,3,3]},
            {name:'7x6-E',columns:7,rows:6,moves:[4,2,2,3,0,3,5,6,5,6,5,6,6,3,6,0,6,2,0,2,1,0,0,1,0,1,4,5,5,1,4,4,4,2,2]},
            {name:'7x6-F',columns:7,rows:6,moves:[1,3,2,0,4,6,1,0,2,4,5,2,2,3,1,1,1,5,1,3,2,4,6,0,4,4,6,2,0,4,3,3,6,3,5]},
          ];
          const repeats=5;
          for(const c of cases){
            const geometry={
              old:impl.old.prepareConnect4RbaGeometry({columns:c.columns,rows:c.rows}),
              new:impl.new.prepareConnect4RbaGeometry({columns:c.columns,rows:c.rows}),
            };
            for(let run=0;run<repeats;run++){
              const order=run&1?['new','old']:['old','new'];
              for(const label of order){
                const t0=performance.now();
                const result=await impl[label].runLazySmpConnect4Rba32(c.moves,{
                  geometry:geometry[label],workers:4,
                  sharedCacheCapacity:65536,
                  localCacheCapacity:65536,
                  sharedSampleMask:0,
                  timeoutMs:30000,
                });
                console.log('BENCH '+JSON.stringify({
                  label,case:c.name,geometry:`${c.columns}x${c.rows}`,run,
                  wallMs:performance.now()-t0,status:result.status,rootWdl:result.rootWdl,
                  move:result.move,winner:result.winner,nodes:result.winnerMetrics?.nodes??null,
                  cutoffs:result.winnerMetrics?.cutoffs??null,cacheHits:result.winnerMetrics?.cacheHits??null,
                  sharedCacheHits:result.sharedCacheHits,sharedCacheStores:result.sharedCacheStores,
                  sharedCacheStoreContention:result.sharedCacheStoreContention,workersUsed:result.workersUsed,
                }));
                if(result.status!=='EXACT')process.exitCode=1;
              }
            }
          }
          NODE
