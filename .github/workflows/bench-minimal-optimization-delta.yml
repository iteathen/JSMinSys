name: Minimal Optimization Delta Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bench-minimal-optimization-delta.yml

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pre-optimization minimal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 73de03943f16361d2a551bccf50c758c9225f84e
          path: before
      - name: Checkout current optimized minimal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/cpc-rebuild-20261004
          path: after
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          check-latest: false
      - name: Run same-runner optimization delta
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {performance} from 'node:perf_hooks';
          import {pathToFileURL} from 'node:url';

          async function load(base){
            const geom=await import(pathToFileURL(process.cwd()+'/'+base+'/addons/rba-connect4-geometry.mjs'));
            const host=await import(pathToFileURL(process.cwd()+'/'+base+'/addons/rba-connect4-lazy-smp-host.mjs'));
            return {prepare:geom.prepareConnect4RbaGeometry,run:host.runLazySmpConnect4Rba32};
          }

          const impl={before:await load('before'),after:await load('after')};
          const fullA=[4,0,0,0,3,3,0,0,6,2,3,0,2,3,6,3,6,3,4,6,2,2,6,1,2,5,6,4];
          const cases=[
            {name:'4x4-empty',columns:4,rows:4,moves:[],timeoutMs:60000},
            {name:'4x4-A',columns:4,rows:4,moves:[0,1,0,1],timeoutMs:30000},
            {name:'4x4-B',columns:4,rows:4,moves:[1,2,1,2,0,3],timeoutMs:30000},
            {name:'4x4-C',columns:4,rows:4,moves:[0,1,1,3,2],timeoutMs:30000},
            {name:'4x4-D',columns:4,rows:4,moves:[2,1,2,0,3,1],timeoutMs:30000},
            {name:'4x4-E',columns:4,rows:4,moves:[0,3,1,3,2,0,2],timeoutMs:30000},
            {name:'7x6-A-r24',columns:7,rows:6,moves:fullA.slice(0,24),timeoutMs:60000},
            {name:'7x6-A',columns:7,rows:6,moves:fullA,timeoutMs:30000},
            {name:'7x6-B',columns:7,rows:6,moves:[2,0,5,3,6,3,5,2,3,3,3,5,0,5,0,0,1,6,1,4,3,4,2,6,6,0,6,4],timeoutMs:30000},
            {name:'7x6-C',columns:7,rows:6,moves:[6,0,2,1,5,2,1,1,1,0,5,2,5,2,4,1,0,1,4,3,2,6,6,6,6,2,4,4,0,6,0,3,4,5,4],timeoutMs:30000},
            {name:'7x6-D',columns:7,rows:6,moves:[1,3,2,0,4,6,1,0,2,4,5,2,2,3,1,1,1,5,1,3,2,4,6,0,4,4,6,2,0,4,3,3],timeoutMs:30000},
            {name:'7x6-E',columns:7,rows:6,moves:[4,2,2,3,0,3,5,6,5,6,5,6,6,3,6,0,6,2,0,2,1,0,0,1,0,1,4,5,5,1,4,4,4,2,2],timeoutMs:30000},
            {name:'7x6-F',columns:7,rows:6,moves:[1,3,2,0,4,6,1,0,2,4,5,2,2,3,1,1,1,5,1,3,2,4,6,0,4,4,6,2,0,4,3,3,6,3,5],timeoutMs:30000},
          ];
          const labels=['before','after'],workers=4,repeats=7;
          for(const c of cases){
            const geometry={
              before:impl.before.prepare({columns:c.columns,rows:c.rows}),
              after:impl.after.prepare({columns:c.columns,rows:c.rows})
            };
            for(let run=0;run<repeats;run++){
              const order=run&1?['after','before']:['before','after'];
              for(const label of order){
                const t0=performance.now();
                const result=await impl[label].run(c.moves,{
                  geometry:geometry[label],workers,workerMode:'minimal',
                  sharedCacheCapacity:65536,localCacheCapacity:65536,
                  sharedSampleMask:0,timeoutMs:c.timeoutMs,
                });
                console.log('MOD '+JSON.stringify({
                  label,case:c.name,geometry:`${c.columns}x${c.rows}`,run,
                  wallMs:performance.now()-t0,status:result.status,rootWdl:result.rootWdl,
                  move:result.move,
                  winnerMetrics:result.winnerMetrics,
                  sharedCacheHits:result.sharedCacheHits,
                  sharedCacheStores:result.sharedCacheStores,
                  sharedCacheStoreContention:result.sharedCacheStoreContention
                }));
                if(result.status!=='EXACT')process.exitCode=1;
              }
            }
          }
          NODE
