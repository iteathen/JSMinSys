name: IsoMax Phase2 4-worker compact shared cache

on:
  pull_request:
    branches: [experiment/isomax-phase2-shared-hash-coalesced-20260927]
    paths:
      - ".github/workflows/isomax-phase2-compact-shared-4w.yml"
      - "experiments/isomax-phase2/compact-shared-source-ab.mjs"
      - "experiments/isomax-phase2/compact-shared-source-sample.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-shared:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize fixed verified arms
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/arm-a" f549dcfdd7d4d0c5ed5cd01cb3141812f1d59862
          git worktree add "$env:RUNNER_TEMP/arm-b" 9594b6b88420d60f113cb5af560de2f128aec0da
      - name: Derived long exact screen
        shell: pwsh
        run: node experiments/isomax-phase2/compact-shared-source-ab.mjs "$env:RUNNER_TEMP/isomax-phase2-compact-shared/derived-long" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" 353335714 8 90000
      - name: Official hard fixed-window screen
        shell: pwsh
        run: node experiments/isomax-phase2/compact-shared-source-ab.mjs "$env:RUNNER_TEMP/isomax-phase2-compact-shared/official-hard" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" 35333571 1 120000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-compact-shared-4w
          path: ${{ runner.temp }}/isomax-phase2-compact-shared
          if-no-files-found: error
          retention-days: 30
