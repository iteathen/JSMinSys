name: IsoMax Phase2 CPC close-only 4-worker

on:
  pull_request:
    branches: [experiment/isomax-phase2-bound-coalesce-shared-20260927]
    paths:
      - ".github/workflows/isomax-phase2-cpc-close-4w.yml"
      - "experiments/isomax-phase2/scaled4-cpc-close.mjs"
      - "experiments/isomax-phase2/scaled4-cpc-close-sample.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize frozen control
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/arm-a" e449df20dc59cc6c1e5b2da78134751a2376f355
      - name: Derived long exact screen
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-cpc-close.mjs "$env:RUNNER_TEMP/isomax-phase2-cpc-close/derived-long" "$env:RUNNER_TEMP/arm-a" "$env:GITHUB_WORKSPACE" 353335714 4 90000
      - name: Official hard fixed-window screen
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-cpc-close.mjs "$env:RUNNER_TEMP/isomax-phase2-cpc-close/official-hard" "$env:RUNNER_TEMP/arm-a" "$env:GITHUB_WORKSPACE" 35333571 1 120000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-cpc-close
          path: ${{ runner.temp }}/isomax-phase2-cpc-close
          if-no-files-found: error
          retention-days: 30
