name: IsoMax hot-loop baseline

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-hotloop-baseline.yml"
      - "experiments/isomax-hotloop-baseline/**"
      - "addons/**"
      - "src/**"
      - "profiles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Record runner
        shell: pwsh
        run: |
          node --version
          git rev-parse HEAD
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors
      - name: A/A short local
        run: node experiments/isomax-hotloop-baseline/run.mjs benchmark-output/short-local . . local 45461667 6
      - name: A/A short shared
        run: node experiments/isomax-hotloop-baseline/run.mjs benchmark-output/short-shared . . shared 45461667 6
      - name: A/A long local
        run: node experiments/isomax-hotloop-baseline/run.mjs benchmark-output/long-local . . local 353335714 2
      - name: A/A long shared
        run: node experiments/isomax-hotloop-baseline/run.mjs benchmark-output/long-shared . . shared 353335714 2
      - name: Separate CPU profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-output/profile | Out-Null
          node --experimental-ffi --cpu-prof --cpu-prof-dir=benchmark-output/profile experiments/isomax-hotloop-baseline/sample.mjs . local 353335714 | Out-File -Encoding utf8 benchmark-output/profile/sample.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-hotloop-baseline
          path: benchmark-output
          if-no-files-found: error
          retention-days: 30
