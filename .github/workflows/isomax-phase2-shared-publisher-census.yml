name: IsoMax Phase2 shared publisher census

on:
  pull_request:
    branches: [experiment/isomax-phase2-shared-hash-coalesced-20260927]
    paths:
      - ".github/workflows/isomax-phase2-shared-publisher-census.yml"
      - "experiments/isomax-phase2/shared-publisher-census-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Check diagnostic syntax
        shell: pwsh
        run: |
          node --check experiments/isomax-phase2/shared-publisher-census-hook.mjs
          node --check experiments/isomax-phase2/shared-publisher-census-run.mjs
      - name: Materialize preferred pure candidate
        shell: pwsh
        run: git worktree add "$env:RUNNER_TEMP/pure" f549dcfdd7d4d0c5ed5cd01cb3141812f1d59862
      - name: Exact derived-long publisher census
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/isomax-phase2-shared-publisher-census" | Out-Null
          0..3 | ForEach-Object {
            node --import ./experiments/isomax-phase2/shared-publisher-census-hook.mjs ./experiments/isomax-phase2/shared-publisher-census-run.mjs "$env:RUNNER_TEMP/pure" 353335714 90000 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/isomax-phase2-shared-publisher-census/derived-long-$_.json"
          }
      - name: Official hard publisher census
        shell: pwsh
        run: node --import ./experiments/isomax-phase2/shared-publisher-census-hook.mjs ./experiments/isomax-phase2/shared-publisher-census-run.mjs "$env:RUNNER_TEMP/pure" 35333571 120000 |
          Tee-Object -FilePath "$env:RUNNER_TEMP/isomax-phase2-shared-publisher-census/official-hard.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-shared-publisher-census
          path: ${{ runner.temp }}/isomax-phase2-shared-publisher-census
          if-no-files-found: error
          retention-days: 30
