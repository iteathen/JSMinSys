name: IsoMax Phase2 coalesced hot-helper pair

on:
  push:
    branches:
      - experiment/isomax-phase2-coalesced-hot-helper-bench-20260927

permissions:
  contents: read

jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Require 4-vCPU hosted topology
        shell: pwsh
        run: node -e "const os=require('node:os'); const n=os.availableParallelism(); console.log(JSON.stringify({availableParallelism:n})); if(n!==4) process.exit(2)"
      - name: Materialize fixed arms
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/arm-a" f549dcfdd7d4d0c5ed5cd01cb3141812f1d59862
          git worktree add "$env:RUNNER_TEMP/arm-b" f3654dd82a2ea902419a37ef548136ebd20d49dd
      - name: Exact derived-long pair
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-pair.mjs "$env:RUNNER_TEMP/isomax-phase2-coalesced-hot-helper/derived-long" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" 353335714 6 90000
      - name: Official hard fixed window
        shell: pwsh
        run: node experiments/isomax-phase2/scaled4-pair.mjs "$env:RUNNER_TEMP/isomax-phase2-coalesced-hot-helper/hard" "$env:RUNNER_TEMP/arm-a" "$env:RUNNER_TEMP/arm-b" 35333571 1 120000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-phase2-coalesced-hot-helper-pair
          path: ${{ runner.temp }}/isomax-phase2-coalesced-hot-helper
          if-no-files-found: error
          retention-days: 30
