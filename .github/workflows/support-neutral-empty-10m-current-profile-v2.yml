name: Support-neutral empty-board 10m current-profile baseline v2

on:
  push:
    branches:
      - experiment/support-neutral-empty-10m-current-profile-v2-20260928
    paths:
      - '.github/workflows/support-neutral-empty-10m-current-profile-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.7.0'
      - name: Materialize current exact-control winner
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/current-winner" 48c514e747cb2656666b951f97e0928dda501cf7
      - name: Empty 7x6 current GitHub-scaled selected profile, 10m
        shell: pwsh
        run: |
          node --version
          node -p "require('os').availableParallelism()"
          node --experimental-ffi experiments/isomax-phase2/scaled4-sample.mjs "$env:RUNNER_TEMP/current-winner" "" 600000
