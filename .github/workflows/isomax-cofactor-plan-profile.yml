name: IsoMax cofactor plan profile

on:
  pull_request:
    branches: [experiment/async-strategist-campaign-20260926]
    paths:
      - ".github/workflows/isomax-cofactor-plan-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Materialize fixed source arms
        shell: pwsh
        run: |
          git worktree add "$env:RUNNER_TEMP/plan-control" 390aed4888a0414afaf0d4c09c051d4ef4a5a13f
          git worktree add "$env:RUNNER_TEMP/plan-candidate" 8d9b3dd2c353a8162addd1a4babbedd84d68f18b
      - name: Profile dense-both control
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP/isomax-cofactor-plan-profile/control"
          New-Item -ItemType Directory -Force $out | Out-Null
          node --experimental-ffi --cpu-prof --cpu-prof-dir=$out experiments/isomax-cofactor-plan/sample.mjs "$env:RUNNER_TEMP/plan-control" 353335714 | Out-File -Encoding utf8 "$out/sample.json"
      - name: Profile support-plan candidate
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP/isomax-cofactor-plan-profile/candidate"
          New-Item -ItemType Directory -Force $out | Out-Null
          node --experimental-ffi --cpu-prof --cpu-prof-dir=$out experiments/isomax-cofactor-plan/sample.mjs "$env:RUNNER_TEMP/plan-candidate" 353335714 | Out-File -Encoding utf8 "$out/sample.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isomax-cofactor-plan-profile
          path: ${{ runner.temp }}/isomax-cofactor-plan-profile
          if-no-files-found: error
          retention-days: 30
